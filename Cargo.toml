[package]
name = "currencyapi-rs"
description = "An api wrapper for currencyapi.com"
homepage = "https://github.com/everapihq/currencyapi-rs"
repository = "https://github.com/everapihq/currencyapi-rs"
documentation = "https://currencyapi.com/docs"
license = "MIT"
version = "0.1.4"
edition = "2021"

[dependencies]
thiserror = "2.0.17"
serde_json = "1.0.148"

[dependencies.serde]
version = "1.0.228"
features = ["derive"]

[dependencies.strum]
version = "0.27.2"
features = ["derive"]

[dependencies.reqwest]
version = "0.13.1"
default-features = false
features = ["rustls", "json"]

[dev-dependencies.tokio]
version = "1.49.0"
features = ["rt", "macros"]
